<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 25 League</title>
<style>
:root{--bg:#e8eaed;--tx:#16181d;--mu:#6a7080;--glass:rgba(255,255,255,.55);--gl2:rgba(255,255,255,.75);--bd:rgba(255,255,255,.85);--hi:rgba(255,255,255,.95);--sh:rgba(60,70,100,.13);--ln:rgba(20,24,40,.08);--gr:#34c759;--bl:#1e90ff;--mg:#f0309e;--grad:linear-gradient(90deg,#17a2ff,#6a6cf2 55%,#f0309e);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e13;--tx:#f3f5fa;--mu:#9aa1b5;--glass:rgba(44,48,64,.5);--gl2:rgba(78,84,108,.55);--bd:rgba(255,255,255,.14);--hi:rgba(255,255,255,.24);--sh:rgba(0,0,0,.5);--ln:rgba(255,255,255,.1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0e13;--tx:#f3f5fa;--mu:#9aa1b5;--glass:rgba(44,48,64,.5);--gl2:rgba(78,84,108,.55);--bd:rgba(255,255,255,.14);--hi:rgba(255,255,255,.24);--sh:rgba(0,0,0,.5);--ln:rgba(255,255,255,.1);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(38vw 30vw at 8% 12%,var(--gr) 0,transparent 70%),radial-gradient(42vw 34vw at 95% 22%,var(--bl) 0,transparent 70%),radial-gradient(40vw 34vw at 78% 100%,var(--mg) 0,transparent 70%);opacity:.2;filter:blur(50px)}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:18px;padding:18px;max-width:1280px;margin:0 auto}
.g{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--bd);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--ln),0 1px 2px var(--sh),0 18px 40px var(--sh);border-radius:30px}
nav{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 36px);overflow:auto;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 14px;font-weight:700;font-size:17px;letter-spacing:-.2px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--grad);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px var(--sh)}
.grp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:var(--mu);margin:18px 12px 6px}
nav a{display:block;padding:9px 14px;border-radius:99px;color:var(--tx);text-decoration:none;font-weight:500;transition:.15s}
nav a:hover{background:var(--gl2)}
nav a.on{background:var(--gl2);box-shadow:inset 0 1px 0 var(--hi),0 2px 10px var(--sh);font-weight:650}
nav a.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gr);margin-right:9px;vertical-align:middle}
main{min-width:0}
h1{font-size:32px;margin:6px 6px 2px;letter-spacing:-.8px}
.sub{color:var(--mu);margin:0 6px 18px}
.card{padding:22px;margin-bottom:16px}
h3{margin:0 0 12px;font-size:17px;letter-spacing:-.2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--tx);background:var(--gl2);border:1px solid var(--bd);box-shadow:inset 0 1px 2px var(--ln);border-radius:99px;padding:9px 16px;outline:none;min-width:0;max-width:100%}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(30,144,255,.35)}
textarea{width:100%;min-height:110px;resize:vertical;border-radius:22px;padding:14px 18px}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--bd);color:var(--tx);background:var(--gl2);border-radius:99px;padding:9px 18px;box-shadow:inset 0 1px 0 var(--hi),0 2px 8px var(--sh);transition:.15s}
button:hover{transform:translateY(-1px)}
button,textarea{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
button.p{background:var(--grad) border-box;color:#fff;border:0;padding:10px 19px;box-shadow:0 6px 16px rgba(106,108,242,.3)}
button.x{padding:3px 12px;color:var(--mu);font-weight:500;box-shadow:none;background:transparent;border-color:transparent}
button.on{background:var(--tx);color:var(--bg)}
.race{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--ln)}.race.proposed{background:var(--gl2);border:1px dashed var(--bd);border-radius:20px;padding:13px;margin:8px 0}.dd{display:inline-block}.dd .ddb{width:100%;border-radius:16px;min-height:42px}.ddm{min-width:100%}.field .dd{display:block;width:100%}.field .ddm{width:100%}
.race:first-of-type{border-top:0}
.dt{width:58px;text-align:center;padding:7px 0;border-radius:20px;background:var(--gl2);box-shadow:inset 0 1px 0 var(--hi),0 2px 8px var(--sh);flex:none}
.dt b{display:block;font-size:20px;line-height:1.1}.dt span{font-size:11px;color:var(--mu);text-transform:uppercase}
.grow{flex:1;min-width:0}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:3px 11px;border-radius:99px;background:var(--gl2);box-shadow:inset 0 1px 0 var(--hi);color:var(--mu);font-weight:600}
.tag.ok{color:#1f9d4c}.tag.nx{color:var(--bl)}
.hero{padding:26px;margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.big{font-size:48px;font-weight:750;letter-spacing:-2px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--ln);white-space:nowrap}
th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.6px;border-top:0}
td.n,th.n{text-align:right}.pos{font-weight:750;width:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.tile{padding:20px}.tile b{display:block;font-size:30px;letter-spacing:-.8px}
.post{padding:16px 0;border-top:1px solid var(--ln);white-space:pre-wrap}
.post:first-of-type{border-top:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}.field label{font-size:12px;font-weight:650;color:var(--mu)}.field input,.field select{width:100%;border-radius:16px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.slot-row,.result-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--ln)}.result-row{grid-template-columns:54px minmax(0,1fr) auto}.step{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gl2);font-weight:750}.helper{font-size:12px;color:var(--mu);margin-top:5px}.poll-option{padding:12px 0;border-top:1px solid var(--ln)}.poll-option:first-child{border-top:0}.poll-track{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:7px}.poll-fill{height:100%;border-radius:99px;background:var(--grad)}.poll-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.txt{white-space:pre-wrap;line-height:1.7}
.empty{color:var(--mu);padding:8px 0}
.sw{position:relative;width:52px;height:32px;display:inline-block;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--gl2);box-shadow:inset 0 1px 3px var(--sh),inset 0 0 0 1px var(--bd);transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px var(--sh);transition:.2s}
.sw input:checked+i{background:var(--gr)}.sw input:checked+i::after{transform:translateX(20px)}
.dd{position:relative;display:inline-block}
.ddb{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:160px;text-align:left}
.ddb::after{content:"";width:7px;height:7px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg) translateY(-2px);transition:.2s;flex:none}
.dd.open .ddb::after{transform:rotate(225deg) translateY(-2px)}
.ddm{display:none;position:absolute;z-index:60;top:calc(100% + 8px);left:0;min-width:100%;max-height:260px;overflow:auto;padding:6px;border-radius:24px;background:var(--gl2);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--bd);box-shadow:inset 0 1px 0 var(--hi),0 18px 40px var(--sh)}
.dd.open .ddm{display:block}
.ddm div{padding:9px 14px;border-radius:18px;cursor:pointer;white-space:nowrap}
.ddm div:hover{background:var(--ln)}
.ddm div.sel{font-weight:650}
.ddm div.sel::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gr);margin-right:8px}
.g:has(.dd.open){position:relative;z-index:50}
nav .dd{display:block;width:100%}nav .ddb{width:100%}nav .ddm{position:static;margin-top:6px}
#menu{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:12px}
nav{position:fixed;z-index:20;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 24px));max-height:none;transform:translateX(-120%);transition:.25s}
nav.open{transform:none}
#menu{display:block;position:fixed;z-index:30;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
h1{font-size:26px}.big{font-size:38px}}
</style>
</head>
<body>
<div class="app"><nav class="g" id="nav"></nav><main id="main"></main></div>
<button id="menu" onclick="document.getElementById('nav').classList.toggle('open')">Menu</button>
<script>
const K="f1liga25b",$=i=>document.getElementById(i),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PTS=[25,18,15,12,10,8,6,4,2,1],CATS=["Announcement","Event text","Race review","Message"];
const NAV=[["General",[["feed","Feed"]]],["Season",[["calendar","Race Calendar"],["voting","Time Voting"],["standings","Championship"]]],["Official",[["rules","Rulebook"],["results","Race Results"],["penalties","Penalty Points"]]],["Administration",[["accounts","Account Management"]]],["Statistics",[["s-drivers","Drivers All-Time"],["s-teams","Teams All-Time"],["s-tracks","Tracks All-Time"],["s-all","All-Time Overview"]]]];
const TITLES={accounts:"Account Management"};NAV.forEach(g=>g[1].forEach(p=>TITLES[p[0]]=p[1]));
function seed(){return{active:"l1",leagues:[{id:"l1",name:"Season 1",done:false,
races:[{id:"a1",track:"Bahrain",date:"2026-11-21",time:"20:00",note:"Full race, 50%"},{id:"a2",track:"Suzuka",date:"2026-11-28",time:"20:00",note:"Full race, 50%"},{id:"a3",track:"Monza",date:"2026-12-05",time:"20:00",note:"Sprint format"}],
drivers:[{name:"Max",team:"Red Bull"},{name:"Lena",team:"Ferrari"},{name:"Tom",team:"Mercedes"},{name:"Jonas",team:"McLaren"},{name:"Sara",team:"Alfa Romeo"}],results:[],pen:[],polls:[]}],
posts:[{id:"n1",c:"Announcement",t:"Welcome to the new season. Check the calendar and the rules before the first race.",d:Date.now()}],
txt:{rules:"1. Races start at the announced time. Be in the lobby 15 minutes early.\n2. Points: 25-18-15-12-10-8-6-4-2-1.\n3. Assists and difficulty are set by the host.\n4. Disconnects: rejoin if possible, no restart.",conduct:"Race clean. Leave space, brake in time and give back positions after cutting a corner.\nNo deliberate collisions. Respect blue flags.",director:"The race director reviews incidents within 48 hours. Evidence: clip with timestamp.\nPenalties: time penalty, grid drop or penalty points."}}}
const API_URL = "https://script.google.com/macros/s/AKfycbwr8aZkchg7ZmSq1DeB1TKZQiaDtiP2xnTgSDOKn--zecKRyDkjSkq-UkHUnkgSEnQ/exec";
let DB;
let saveQueue = Promise.resolve();
let AUTH=null;
let saving=false,refreshBusy=false,lastServerSnapshot="",pendingRefreshData=null;
const AUTH_KEY="f1liga25_auth_v1";
const isAdmin=()=>AUTH?.role==="admin";
const isLoggedIn=()=>!!AUTH?.token;
async function api(action,payload={}){const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:AUTH?.token||"",...payload})});const result=await response.json();if(!response.ok||!result.success)throw new Error(result.error||"Request failed");return result;}

const L = () =>
  DB.leagues.find(l => l.id == DB.active) || DB.leagues[0];

const S = {
  get races(){return L().races},
  set races(v){L().races=v},
  get drivers(){return L().drivers},
  set drivers(v){L().drivers=v},
  get results(){return L().results},
  set results(v){L().results=v},
  get pen(){return L().pen},
  set pen(v){L().pen=v},
  get polls(){return L().polls},
  set polls(v){L().polls=v},
  get posts(){return DB.posts},
  set posts(v){DB.posts=v},
  get txt(){return DB.txt}
};

const save = () => {
  if(!isAdmin()){alert("Only an administrator can make this change.");return Promise.reject(new Error("Permission denied"));}
  const snapshot=JSON.stringify(DB);
  try{localStorage.setItem(K,snapshot)}catch(e){}
  saving=true;
  saveQueue=saveQueue.catch(()=>{}).then(()=>api("save",{data:JSON.parse(snapshot)})).then(r=>{lastServerSnapshot=snapshot;return r}).finally(()=>{saving=false;});
  saveQueue.catch(e=>alert("Could not save: "+e.message));
  return saveQueue;
};

async function init(){
  try{
    const cached=localStorage.getItem(AUTH_KEY);
    if(cached){
      AUTH=JSON.parse(cached);
      const r=await api("sync");
      DB=r.data;lastServerSnapshot=JSON.stringify(DB);
      normalizeDb();render();startAutoRefresh();return;
    }
  }catch(e){console.warn("Saved login could not be restored:",e);}
  AUTH=null;try{localStorage.removeItem(AUTH_KEY)}catch(e){}
  renderLogin();
}
function normalizeDb(){
  DB.leagues.forEach(l=>{if(!Array.isArray(l.polls))l.polls=[];if(Array.isArray(l.races))l.races.forEach(x=>{if(!x.status)x.status=x.date?"confirmed":"proposed";});});
}
function hasActiveEditor(){
  const active=document.activeElement;
  return !!(active && (active.tagName==="INPUT" || active.tagName==="TEXTAREA" || active.tagName==="SELECT"));
}
function applyServerSnapshot(data,snapshot){
  DB=data;normalizeDb();lastServerSnapshot=snapshot;pendingRefreshData=null;
  if(!pg[cur()])location.hash="#calendar";
  else render();
}
function applyPendingRefresh(){
  if(!pendingRefreshData || hasActiveEditor() || document.querySelector(".dd.open") || saving)return;
  const pending=pendingRefreshData;
  applyServerSnapshot(pending.data,pending.snapshot);
}
function startAutoRefresh(){
  if(window.__f1AutoRefreshStarted)return;window.__f1AutoRefreshStarted=true;
  window.setInterval(async()=>{
    if(!isLoggedIn() || saving || refreshBusy || document.hidden)return;
    refreshBusy=true;
    try{
      const r=await api("sync");
      const snapshot=JSON.stringify(r.data);
      if(snapshot!==lastServerSnapshot){
        if(hasActiveEditor() || document.querySelector(".dd.open")){
          pendingRefreshData={data:r.data,snapshot};
        }else{
          applyServerSnapshot(r.data,snapshot);
        }
      }
    }catch(e){
      if(/sign in again|session expired/i.test(e.message)){
        AUTH=null;try{localStorage.removeItem(AUTH_KEY)}catch(_){};renderLogin();
      }else console.warn("Background refresh failed:",e);
    }finally{refreshBusy=false;}
  },10000);
}
addEventListener("focusout",()=>window.setTimeout(applyPendingRefresh,0));
addEventListener("click",()=>window.setTimeout(applyPendingRefresh,0));

function renderLogin(){
  $("nav").innerHTML='<div class="brand"><div class="logo"></div>F1 25 League</div>';
  $("main").innerHTML=`<div class="g card" style="max-width:440px;margin:8vh auto"><h1 style="margin:0 0 6px">League login</h1><p class="mu">Sign in with your personal account.</p><div class="field" style="margin-top:18px"><label>Username</label><input id="login-user" autocomplete="username" placeholder="Username"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="login-pass" type="password" autocomplete="current-password" placeholder="Password"></div><p id="login-error" class="mu" style="color:#d33"></p><button class="p" style="margin-top:12px" onclick="login()">Sign in</button></div>`;
}
async function login(){const username=$("login-user").value.trim(),password=$("login-pass").value;$("login-error").textContent="";try{const r=await api("login",{username,password});AUTH={token:r.token,username:r.user.username,role:r.user.role};try{localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH));}catch(e){}DB=r.data;normalizeDb();lastServerSnapshot=JSON.stringify(DB);render();startAutoRefresh();}catch(e){$("login-error").textContent=e.message||"Login failed";}}
async function logout(){const token=AUTH?.token;try{if(token)await api("logout");}catch(e){}AUTH=null;DB=null;try{localStorage.removeItem(AUTH_KEY)}catch(e){}renderLogin();}

let editing=false,fc="";
const cur=()=>location.hash.slice(1)||"calendar";
const fmt=(d,o)=>new Date(d+"T12:00").toLocaleDateString("en-GB",o);
function stats(ls,noT){const D={},T={};
const dr=(n,t)=>D[n.toLowerCase()]||(D[n.toLowerCase()]={name:n,team:t,pts:0,w:0,p:0,r:0,ti:0});
const tm=n=>T[n]||(T[n]={name:n,pts:0,w:0,p:0});
ls.forEach(l=>{const tt={};l.drivers.forEach(d=>{tt[d.name.toLowerCase()]=d.team;dr(d.name,d.team).team=d.team;tm(d.team)});
l.results.forEach(r=>r.order.forEach((n,i)=>{const t=tt[n.toLowerCase()]||"-",d=dr(n,t),p=PTS[i]||0;d.pts+=p;d.r++;if(i==0)d.w++;if(i<3)d.p++;const x=tm(t);x.pts+=p;if(i==0)x.w++;if(i<3)x.p++}))});
if(!noT)ls.forEach(l=>{const c=champ(l);if(c)D[c.name.toLowerCase()].ti++});
const s=o=>Object.values(o).sort((x,y)=>y.pts-x.pts||y.w-x.w||x.name.localeCompare(y.name));return{d:s(D),t:s(T)}}
const champ=l=>{if(!l.done)return null;const c=stats([l],1).d[0];return c&&c.pts?c:null};
const raceOf=id=>S.races.find(r=>r.id==id);
const table=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th class="${x.n?"n":""}">${esc(x.t||x)}</th>`).join("")}</tr>${rows.join("")}</table></div>`;
const pg={};
let pollSlots=[{date:"",time:"20:00"},{date:"",time:"21:00"}];
let resultRaceId="",resultDraft=[];
pg.calendar=()=>{
  const rs=[...S.races].sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.time||"").localeCompare(b.time||""));
  const done=id=>S.results.some(r=>r.raceId==id);
  const proposed=rs.filter(r=>r.status==="proposed"||!r.date);
  const scheduled=rs.filter(r=>r.status!=="proposed"&&r.date);
  const nx=scheduled.find(r=>!done(r.id)&&new Date(r.date+"T"+(r.time||"23:59"))>Date.now());let h="";
  if(nx){const days=Math.max(0,Math.ceil((new Date(nx.date+"T"+(nx.time||"00:00"))-Date.now())/864e5));h+=`<div class="g hero"><div><div class="mu">Next confirmed race</div><h2 style="margin:2px 0;font-size:28px;letter-spacing:-.6px">${esc(nx.track)}</h2><div class="mu">${fmt(nx.date,{weekday:"long",day:"numeric",month:"long"})} at ${esc(nx.time||"Time TBC")}</div></div><div><div class="big">${days}</div><div class="mu">${days==1?"day":"days"} to go</div></div></div>`}
  const proposedRows=proposed.map(r=>`<div class="race proposed"><div class="dt"><b>?</b><span>Proposed</span></div><div class="grow"><b>${esc(r.track)}</b><div class="mu">${esc(r.note||"Race proposed · waiting for a date and time vote")}</div></div><span class="tag nx">Needs a time vote</span>${isAdmin()?`<button class="x" onclick="del('races','${r.id}')">Remove</button>`:""}</div>`).join("");
  const scheduledRows=scheduled.map(r=>`<div class="race"><div class="dt"><b>${fmt(r.date,{day:"numeric"})}</b><span>${fmt(r.date,{month:"short"})}</span></div><div class="grow"><b>${esc(r.track)}</b><div class="mu">${esc(r.time||"Time TBC")}${r.note?" - "+esc(r.note):""}</div></div><span class="tag ${done(r.id)?"ok":nx&&nx.id==r.id?"nx":""}">${done(r.id)?"Completed":nx&&nx.id==r.id?"Next":"Confirmed"}</span>${isAdmin()?`<button class="x" onclick="del('races','${r.id}')">Remove</button>`:""}</div>`).join("");
  return h+`<div class="g card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Proposed races</h3><span class="tag nx">${proposed.length} awaiting a vote</span></div><p class="mu">These races are planned, but their date and time are not confirmed yet. Create a Time Voting poll to let everyone choose.</p>${proposedRows||'<div class="empty">No proposed races. Add one below to start planning.</div>'}</div>
  <div class="g card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Confirmed race calendar</h3><span class="tag ok">${scheduled.length} scheduled</span></div>${scheduledRows||'<div class="empty">No confirmed race dates yet. Close a time poll to add one here.</div>'}</div>
  ${isAdmin()?`<div class="g card"><h3>Propose a race</h3><p class="mu">Add the track first. The date and time will be decided in Time Voting.</p><div class="form-grid"><div class="field"><label for="rt">Track</label><input id="rt" placeholder="e.g. Suzuka"></div><div class="field"><label for="rn">Format / note (optional)</label><input id="rn" placeholder="e.g. Sprint, 50% distance"></div></div><div style="margin-top:12px"><button class="p" onclick="addRace()">＋ Propose race</button></div></div>`:""}`;
};
pg.voting=()=>{
  if(!Array.isArray(S.polls))S.polls=[];
  const members=S.drivers||[];
  const polls=[...S.polls].reverse();
  const proposed=S.races.filter(r=>r.status==="proposed"||!r.date);
  const raceChoices=[["","Choose a proposed race"],...proposed.map(r=>[r.id,r.track])];
  const slots=pollSlots.map((slot,i)=>`<div class="slot-row"><div class="field"><label for="poll-date-${i}">Option ${i+1} · Date</label><input id="poll-date-${i}" type="date" value="${esc(slot.date)}" onchange="pollSlots[${i}].date=this.value"></div><div class="field"><label for="poll-time-${i}">Time</label><input id="poll-time-${i}" type="time" value="${esc(slot.time)}" onchange="pollSlots[${i}].time=this.value"></div><button class="x" type="button" onclick="removePollSlot(${i})" ${pollSlots.length<=2?'disabled':''}>Remove</button></div>`).join("");
  const create=`<div class="g card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Create a time poll</h3><p class="mu" style="margin:4px 0 0">Choose a proposed race, then add date and time options for everyone to vote on.</p></div><span class="tag">New poll</span></div><div class="form-grid" style="margin-top:16px"><div class="field"><label for="polltitle">Poll title</label><input id="polltitle" placeholder="e.g. Suzuka race night"></div><div class="field"><label>Proposed race</label>${dd("pollrace",raceChoices)}</div></div><div style="margin-top:18px"><div class="row" style="justify-content:space-between"><b>Date & time options</b><span class="mu">At least 2 options</span></div>${slots}<div class="row" style="margin-top:12px"><button type="button" onclick="addPollSlot()">＋ Add another option</button><button class="p" onclick="createPoll()">Create poll</button></div></div></div>`;
  const cards=polls.map(p=>{
    const votes=Array.isArray(p.votes)?p.votes:[],options=Array.isArray(p.options)?p.options:[],total=votes.length;
    const results=options.map(o=>{const count=votes.filter(v=>v.optionId===o.id).length,pct=total?Math.round(count/total*100):0;return `<div class="poll-option"><div class="row" style="justify-content:space-between"><b>${esc(o.label)}</b><span class="mu">${count} vote${count===1?"":"s"} · ${pct}%</span></div><div class="poll-track"><div class="poll-fill" style="width:${pct}%"></div></div></div>`}).join("");
    const voterId="pollvoter-"+p.id,choiceId="pollchoice-"+p.id;
    const ownMember=members.find(d=>d.name.toLowerCase()===AUTH.username.toLowerCase());
    const selected=ownMember?`<div class="form-grid" style="margin-top:14px"><div class="field"><label>Your account</label>${dd(voterId,[[ownMember.name,ownMember.name]],ownMember.name)}</div><div class="field"><label>Your preferred date/time</label>${dd(choiceId,[["","Choose an option"],...options.map(o=>[o.id,o.label])])}</div><div class="field" style="justify-content:end"><button class="p" onclick="castVote('${p.id}')">Submit / change vote</button></div></div>`:`<p class="mu">Add league members in Championship before voting.</p>`;
    const linkedRace=S.races.find(r=>r.id===p.raceId);
    const best=[...options].sort((a,b)=>votes.filter(v=>v.optionId===b.id).length-votes.filter(v=>v.optionId===a.id).length)[0];
    const winnerId="pollwinner-"+p.id;
    const closeControl=(isAdmin()&&!p.closed&&linkedRace)?`<div class="field" style="margin-top:14px"><label>Winning date/time to add to the calendar</label>${dd(winnerId,options.map(o=>[o.id,o.label]),best?.id)}</div>`:"";
    const scheduledNote=p.closed&&p.scheduledOption?`<p class="mu" style="margin-top:10px">Added to calendar: <b>${esc(options.find(o=>o.id===p.scheduledOption)?.label||"Selected time")}</b></p>`:"";
    return `<div class="g card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0 0 5px">${esc(p.title)}</h3><div class="mu">${linkedRace?"Race: "+esc(linkedRace.track):"No linked race"} · ${total} vote${total===1?"":"s"}</div></div><span class="tag ${p.closed?"":"ok"}">${p.closed?"Closed":"Open"}</span></div><div style="margin-top:14px">${results}</div>${p.closed?'<p class="mu" style="margin-top:12px">Voting is closed.</p>':selected}${closeControl}${scheduledNote}<div class="poll-actions" style="margin-top:14px">${isAdmin()?(p.closed?`<button onclick="reopenPoll('${p.id}')">Reopen poll</button>`:`<button class="p" onclick="closePoll('${p.id}')">Close poll${linkedRace?' & add to calendar':''}</button>`)+`<button class="x" onclick="deletePoll('${p.id}')">Delete</button>`:""}</div></div>`;
  }).join("");
  return (isAdmin()?create:`<div class="g card"><h3>Time Voting</h3><p class="mu">Choose your preferred option in an open poll. You can change your vote at any time before it closes.</p></div>`)+(cards||'<div class="g card empty">No polls yet. Add a proposed race in Race Calendar, then create a poll here.</div>');
};
pg.standings=()=>{const l=L(),s=stats([l]);return`<div class="g card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(l.name)}</h3><div class="mu">${l.done?"Season finished. The champion is part of the Hall of Fame.":"Season in progress."}</div></div>${isAdmin()?`<div class="row"><span class="mu">Season finished</span><label class="sw"><input type="checkbox" ${l.done?"checked":""} onchange="L().done=this.checked;save();render()"><i></i></label></div>`:""}</div></div>
<div class="g card"><h3>Drivers</h3>${table(["#","Driver","Team",{t:"Wins",n:1},{t:"Podiums",n:1},{t:"Points",n:1}],s.d.map((d,i)=>`<tr><td class="pos">${i+1}</td><td><b>${esc(d.name)}</b>${l.done&&i==0&&d.pts?' <span class="tag ok">Champion</span>':""}</td><td class="mu">${esc(d.team)}</td><td class="n">${d.w}</td><td class="n">${d.p}</td><td class="n"><b>${d.pts}</b></td></tr>`))}</div>
<div class="g card"><h3>Teams</h3>${table(["#","Team",{t:"Wins",n:1},{t:"Points",n:1}],s.t.map((d,i)=>`<tr><td class="pos">${i+1}</td><td><b>${esc(d.name)}</b></td><td class="n">${d.w}</td><td class="n"><b>${d.pts}</b></td></tr>`))}</div>
<div class="g card"><h3>League members</h3><div class="row" style="margin-bottom:12px">${l.drivers.map((d,i)=>`<span class="tag">${esc(d.name)} / ${esc(d.team)} ${isAdmin()?`<a href="#standings" onclick="S.drivers.splice(${i},1);save();render();return false" style="color:inherit;margin-left:6px;text-decoration:none">x</a>`:""}</span>`).join("")}</div>${isAdmin()?`<div class="row"><input id="dn" placeholder="Driver name"><input id="dt" placeholder="Team"><button class="p" onclick="addDriver()">Add member</button></div>`:""}</div>
${isAdmin()?`<div class="g card"><h3>New league</h3><div class="row"><input id="ln" placeholder="League name, e.g. Season 2"><label class="row mu"><span class="sw"><input type="checkbox" id="lk" checked><i></i></span>Keep members</label><button class="p" onclick="addLeague()">Create</button></div><p class="helper">Delete seasons in Account Management.</p></div>`:""}`};

pg.results=()=>{
  const races=S.races.filter(r=>r.status!=="proposed"&&r.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(!races.some(r=>r.id===resultRaceId))resultRaceId=races[0]?.id||"";
  const existing=S.results.find(r=>r.raceId===resultRaceId);
  if(!resultDraft.length)resultDraft=existing?[...existing.order]:[""];
  const rows=resultDraft.map((name,i)=>`<div class="result-row"><div class="step">P${i+1}</div><div class="field"><label>${i===0?'Race winner':i===1?'2nd place':i===2?'3rd place':`Position ${i+1}`}</label>${dd("result-driver-"+i,[["","Select driver"],...S.drivers.map(d=>[d.name,d.name])],name,v=>{resultDraft[i]=v})}</div><button class="x" onclick="removeResultDriver(${i})" ${resultDraft.length<=1?'disabled':''}>Remove</button></div>`).join("");
  const saved=[...S.results].reverse().map(r=>{const rc=raceOf(r.raceId);return `<div class="g card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(rc?rc.track:"Race")}</h3><div class="mu">${rc?fmt(rc.date,{day:"numeric",month:"long",year:"numeric"}):"Race no longer in calendar"}</div></div>${isAdmin()?`<button class="x" onclick="editResult('${r.raceId}')">Edit result</button><button class="x" onclick="del('results','${r.id}')">Remove</button>`:""}</div>${table(["Position","Driver",{t:"Points",n:1}],r.order.map((n,i)=>`<tr><td class="pos">P${i+1}</td><td>${esc(n)}</td><td class="n"><b>${PTS[i]||0}</b></td></tr>`))}</div>`}).join("");
  return `${isAdmin()?`<div class="g card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Enter race result</h3><p class="mu" style="margin:4px 0 0">Choose the race, then select each driver in finishing order. Points are added automatically.</p></div><span class="tag">${existing?'Editing saved result':'New result'}</span></div>${races.length?`<div class="field" style="margin-top:16px"><label>Race</label>${dd("result-race",[["","Choose a race"],...races.map(r=>[r.id,`${r.track} · ${fmt(r.date,{day:"numeric",month:"short",year:"numeric"})}`])],resultRaceId,v=>setResultRace(v))}</div><div style="margin-top:14px"><div class="row" style="justify-content:space-between"><b>Finishing order</b><span class="mu">P1 gets ${PTS[0]} pts · P10 gets ${PTS[9]} pt</span></div>${rows}<div class="row" style="margin-top:12px"><button type="button" onclick="addResultDriver()">＋ Add finishing position</button><button class="p" onclick="saveResult()" ${!resultRaceId?'disabled':''}>Save race result</button></div></div>`:'<p class="empty">Add a race in Race Calendar before entering results.</p>'}</div>`:`<div class="g card"><h3>Race Results</h3><p class="mu">Results are read-only for regular members.</p></div>`}${saved||'<div class="g card empty">No race results have been entered yet.</div>'}`;
};
pg.penalties=()=>{const tot={};S.pen.forEach(p=>tot[p.driver]=(tot[p.driver]||0)+p.pts);return`<div class="g card"><h3>Totals</h3><div class="row">${Object.keys(tot).map(k=>`<span class="tag">${esc(k)}: <b>${tot[k]}</b></span>`).join("")||'<span class="mu">No penalty points.</span>'}</div></div>
${isAdmin()?`<div class="g card"><h3>Add penalty</h3><div class="row">${dd("pd",S.drivers.map(d=>[d.name,d.name]))}<input id="pp" type="number" min="1" value="1" style="width:84px"><input id="pr" placeholder="Reason / race" style="flex:1"><button class="p" onclick="addPen()">Add</button></div></div>`:""}
<div class="g card"><h3>History</h3>${table(["Driver",{t:"Points",n:1},"Reason",""],[...S.pen].reverse().map(p=>`<tr><td><b>${esc(p.driver)}</b></td><td class="n">${p.pts}</td><td class="mu">${esc(p.reason)}</td><td>${isAdmin()?`<button class="x" onclick="del('pen','${p.id}')">Remove</button>`:""}</td></tr>`))}</div>`};
pg.feed=()=>`<div class="g card"><div class="row" style="margin-bottom:12px">${dd("fk",(isAdmin()?CATS:CATS.filter(c=>c!=="Announcement")).map(c=>[c,c]))}</div><textarea id="fp" placeholder="Write a post"></textarea><div style="margin-top:12px"><button class="p" onclick="addPost()">Post</button></div></div>
<div class="row" style="margin:0 4px 14px">${["",...CATS].map(c=>`<button class="${fc==c?"on":""}" onclick="fc='${c}';render()">${c||"All"}</button>`).join("")}</div>
<div class="g card">${[...S.posts].filter(p=>!fc||p.c==fc).reverse().map(p=>`<div class="post"><span class="tag">${esc(p.c)}</span><div style="margin-top:8px">${esc(p.t)}</div><div class="mu" style="margin-top:6px">${new Date(p.d).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"})} ${isAdmin()?`<button class="x" onclick="del('posts','${p.id}')">Remove</button>`:""}</div></div>`).join("")||'<div class="empty">Nothing here yet.</div>'}</div>`;

pg.accounts=()=>`<div class="g card"><h3>Account management</h3><p class="mu">Create individual logins and assign roles. Accounts are stored securely by Google Apps Script.</p><div class="form-grid"><div class="field"><label>Username</label><input id="newuser" placeholder="e.g. Lena"></div><div class="field"><label>Temporary password</label><input id="newpass" type="password" placeholder="At least 10 characters"></div><div class="field"><label>Role</label>${dd("newrole",[["user","Regular user"],["admin","Admin"]],"user")}</div></div><button class="p" style="margin-top:14px" onclick="createAccount()">Create account</button></div><div class="g card"><h3>Registered accounts</h3><div id="account-list" class="empty">Loading accounts…</div></div><div class="g card"><h3>Season management</h3><p class="mu">Deleting a season permanently removes its races, votes, results and penalties.</p>${dd("deleteseason",DB.leagues.map(l=>[l.id,l.name]))}<button class="x" onclick="deleteSeason()">Delete selected season</button></div>`;
async function changeMyPassword(){const password=prompt("Enter your new password (at least 10 characters):");if(!password)return;try{await api("changePassword",{password});alert("Your password has been changed.");}catch(e){alert(e.message);}}
async function refreshAccounts(){try{const r=await api("listUsers");$("account-list").innerHTML=r.users.map(u=>`<div class="race"><div class="grow"><b>${esc(u.username)}</b><div class="mu">${u.role==="admin"?"Administrator":"Regular user"}</div></div><button class="x" onclick="resetAccountPassword('${esc(u.username)}')">Reset password</button>${u.username!=="Albert"?`<button class="x" onclick="removeAccount('${esc(u.username)}')">Delete</button>`:""}</div>`).join("")||"No accounts.";}catch(e){$("account-list").textContent=e.message;}}
async function createAccount(){try{await api("createUser",{username:$("newuser").value.trim(),password:$("newpass").value,role:DDV.newrole||"user"});alert("Account created.");render();refreshAccounts();}catch(e){alert(e.message);}}
async function removeAccount(username){if(!confirm(`Delete account ${username}?`))return;try{await api("deleteUser",{username});refreshAccounts();}catch(e){alert(e.message);}}
async function resetAccountPassword(username){const password=prompt(`New temporary password for ${username} (at least 10 characters):`);if(!password)return;try{await api("resetPassword",{username,password});alert("Password updated.");}catch(e){alert(e.message);}}
async function deleteSeason(){const id=DDV.deleteseason;if(!id||DB.leagues.length<2){alert("Keep at least one season.");return;}if(!confirm("Permanently delete this season and all its data?"))return;try{await api("deleteSeason",{seasonId:id});DB.leagues=DB.leagues.filter(l=>l.id!==id);if(DB.active===id)DB.active=DB.leagues[0].id;render();}catch(e){alert(e.message);}}

const AL=()=>DB.leagues;

pg["s-tracks"]=()=>{const rows=[];AL().forEach(l=>l.results.forEach(r=>{const c=l.races.find(x=>x.id==r.raceId);rows.push(`<tr><td><b>${esc(c?c.track:"-")}</b></td><td class="mu">${esc(l.name)}</td><td>${esc(r.order[0]||"")}</td><td class="mu">${esc(r.order[1]||"")}</td></tr>`)}));return`<div class="g card">${table(["Track","League","Winner","Runner-up"],rows)}${rows.length?"":'<div class="empty">No results yet.</div>'}</div>`};

return`<div class="grid">${t("Leagues",AL().length)}${t("Races held",AL().reduce((a,l)=>a+l.results.length,0))}${t("Drivers",s.d.length)}${t("Points awarded",s.d.reduce((a,d)=>a+d.pts,0))}${t("Penalty points",AL().reduce((a,l)=>a+l.pen.reduce((b,p)=>b+p.pts,0),0))}</div>
<div class="g card"><h3>Hall of Fame</h3>${ch.map(l=>{const c=champ(l);return`<div class="race"><div class="dt"><b>1</b><span>Champ</span></div><div class="grow"><b>${esc(c.name)}</b><div class="mu">${esc(c.team)} - ${esc(l.name)}</div></div><span class="tag">${c.pts} pts</span></div>`}).join("")||'<div class="empty">Champions appear here automatically when a league is marked as finished.</div>'}</div>`};
const DDV={},DDO={},DDF={};
function dd(id,opts,def,fn){const v=DDV[id]!=null&&opts.some(o=>o[0]==DDV[id])?DDV[id]:(def!=null?def:(opts[0]?opts[0][0]:""));DDV[id]=v;DDO[id]=opts;DDF[id]=fn;const c=opts.find(o=>o[0]==v);
return`<div class="dd" id="${id}"><button type="button" class="ddb" onclick="ddt(event,'${id}')">${esc(c?c[1]:"Select")}</button><div class="ddm">${opts.map((o,i)=>`<div class="${o[0]==v?"sel":""}" onclick="dds('${id}',${i})">${esc(o[1])}</div>`).join("")}</div></div>`}
function ddt(e,id){e.stopPropagation();const el=$(id),o=el.classList.contains("open");document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open"));if(!o)el.classList.add("open")}
function dds(id,i){const o=DDO[id][i],el=$(id);DDV[id]=o[0];el.querySelector(".ddb").textContent=o[1];el.querySelectorAll(".ddm div").forEach((d,j)=>d.className=j==i?"sel":"");el.classList.remove("open");if(DDF[id])DDF[id](o[0])}
addEventListener("click",()=>document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")));
function del(k,id){S[k]=S[k].filter(x=>x.id!=id);if(k=="races")S.results=S.results.filter(r=>r.raceId!=id);save();render()}
function addRace(){const t=$("rt").value.trim();if(!t){alert("Enter a track name first.");return}S.races.push({id:uid(),track:t,date:"",time:"",note:$("rn").value.trim(),status:"proposed"});save();render()}
function addDriver(){const n=$("dn").value.trim();if(!n)return;S.drivers.push({name:n,team:$("dt").value.trim()||"Independent"});save();render()}
function addLeague(){const n=$("ln").value.trim();if(!n)return;const id=uid();DB.leagues.push({id,name:n,done:false,races:[],results:[],pen:[],polls:[],drivers:$("lk").checked?JSON.parse(JSON.stringify(L().drivers)):[]});DB.active=id;save();render()}
function setResultRace(id){resultRaceId=id;const old=S.results.find(r=>r.raceId===id);resultDraft=old?[...old.order]:[""];render()}
function editResult(id){resultRaceId=id;const old=S.results.find(r=>r.raceId===id);resultDraft=old?[...old.order]:[""];render()}
function addResultDriver(){resultDraft.push("");render()}
function removeResultDriver(i){if(resultDraft.length<=1)return;resultDraft.splice(i,1);render()}
function saveResult(){const order=resultDraft.map(x=>String(x||"").trim()).filter(Boolean);if(!resultRaceId||!order.length){alert("Choose a race and at least one finishing driver.");return}if(new Set(order).size!==order.length){alert("Each driver can only appear once in the finishing order.");return}S.results=S.results.filter(r=>r.raceId!==resultRaceId);S.results.push({id:uid(),raceId:resultRaceId,order});resultDraft=[];save();render()}
function addPen(){if(!DDV.pd)return;S.pen.push({id:uid(),driver:DDV.pd,pts:+$("pp").value||1,reason:$("pr").value.trim()});save();render()}
async function addPost(){const t=$("fp").value.trim(),category=DDV.fk;if(!t)return;if(category==="Announcement"&&!isAdmin()){alert("Only admins can publish announcements.");return;}try{if(isAdmin()){S.posts.push({id:uid(),c:category,t,d:Date.now()});await save();}else{const r=await api("post",{category,text:t});DB.posts=r.posts;}render();}catch(e){alert(e.message);}}
function addPollSlot(){pollSlots.push({date:"",time:"20:00"});render()}
function removePollSlot(i){if(pollSlots.length<=2)return;pollSlots.splice(i,1);render()}
function createPoll(){const title=$("polltitle").value.trim(),raceId=DDV.pollrace||"";const slots=pollSlots.map((x,i)=>({date:$("poll-date-"+i)?.value||x.date,time:$("poll-time-"+i)?.value||x.time})).filter(x=>x.date&&x.time);if(!title||!raceId||slots.length<2){alert("Choose a proposed race, add a poll title and at least two complete date/time options.");return}const options=slots.map(x=>({id:uid(),date:x.date,time:x.time,label:new Date(x.date+"T"+x.time).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}));S.polls.push({id:uid(),title,raceId,options,votes:[],closed:false,created:Date.now()});pollSlots=[{date:"",time:"20:00"},{date:"",time:"21:00"}];DDV.pollrace="";save();render()}
async function castVote(id){const poll=S.polls.find(p=>p.id===id);if(!poll||poll.closed)return;const driver=DDV["pollvoter-"+id],optionId=DDV["pollchoice-"+id];if(!driver||!optionId){alert("Select your name and a time slot first.");return}try{const r=await api("vote",{pollId:id,driver,optionId});const target=S.polls.find(p=>p.id===id);target.votes=r.votes;render();}catch(e){alert(e.message);}}
function closePoll(id){const poll=S.polls.find(p=>p.id===id);if(!poll)return;const race=S.races.find(r=>r.id===poll.raceId);if(race){const optionId=DDV["pollwinner-"+id];const option=poll.options.find(o=>o.id===optionId);if(!option){alert("Choose the date and time to schedule.");return}if(!poll.votes.length){if(!confirm("Nobody has voted yet. Close and schedule the selected option anyway?"))return}race.date=option.date;race.time=option.time;race.status="confirmed";poll.scheduledOption=option.id;}poll.closed=true;save();render()}
function reopenPoll(id){const poll=S.polls.find(p=>p.id===id);if(!poll)return;poll.closed=false;const race=S.races.find(r=>r.id===poll.raceId);if(race&&poll.scheduledOption){race.status="proposed";race.date="";race.time="";delete poll.scheduledOption}save();render()}
function deletePoll(id){if(!confirm("Delete this poll and all its votes?"))return;S.polls=S.polls.filter(p=>p.id!==id);save();render()}
function render(){if(!isLoggedIn()){renderLogin();return;}const c=pg[cur()]?cur():"calendar";if(c==="accounts"&&!isAdmin()){location.hash="#calendar";return;}
$("nav").innerHTML=`<div class="brand"><div class="logo"></div>F1 25 League</div><div class="mu" style="padding:0 12px 10px">${esc(AUTH.username)} · ${isAdmin()?"Admin":"Member"}</div>${(DDV.lg=L().id,dd("lg",DB.leagues.map(l=>[l.id,l.name]),null,v=>switchSeason(v)))}`+NAV.map(g=>{if(g[0]==="Administration"&&!isAdmin())return"";return `<div class="grp">${g[0]}</div>`+g[1].map(p=>`<a href="#${p[0]}" class="${p[0]==c?"on":""}">${p[1]}</a>`).join("")}).join("")+`<button style="margin:14px 10px" onclick="changeMyPassword()">Change password</button><button style="margin:0 10px 14px" onclick="logout()">Log out</button>`;
const subs={calendar:"Plan race nights and see what is next.",voting:"Vote on the date and time that works best for your next race.",standings:"Standings, members and seasons of your league.",results:"Race finishing orders and points.",penalties:"Track penalty points per driver.",rules:"Rules, driving conduct and the race director guide in one place.",feed:"Announcements, event texts, race reviews and messages in one place.",accounts:"Manage league accounts, roles and seasons."};
$("main").innerHTML=`<h1>${TITLES[c]||"Account Management"}</h1><p class="sub">${subs[c]||"F1 25 league administration."}</p>`+pg[c]();$("nav").classList.remove("open");if(c==="accounts")refreshAccounts();}
async function switchSeason(id){try{await api("switchSeason",{seasonId:id});DB.active=id;render();}catch(e){alert(e.message);}}

addEventListener("hashchange",()=>{
  editing=false;
  render();
  scrollTo(0,0);
});

init();
</script>
</body>
