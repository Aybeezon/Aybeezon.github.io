  const stack=$("toast-stack");if(!stack){console[type==="error"?"error":"log"](message);return;}
  const item=document.createElement("div");item.className="toast "+type;
  const mark=document.createElement("span");mark.className="toast-mark";
  const text=document.createElement("div");text.className="toast-text";text.textContent=String(message);
  item.append(mark,text);stack.append(item);setTimeout(()=>{item.style.opacity="0";item.style.transform="translateY(-6px)";setTimeout(()=>item.remove(),220)},3600);
}

/* ───────────── Stage 1 data layer ─────────────
   STORE holds only what the visited pages needed. Every page declares the data it needs (PAGE_NEEDS);
   a lightweight "poll" request (versions only) tells us what changed, and only those parts are re-downloaded.
   The selected season is PER BROWSER TAB (sessionStorage) and is sent with each request; the server never has a
   shared "active season". It is also stored as a personal preference to restore it after the next login. */
const STORE={seasons:[],seasonId:"",data:{},posts:{items:[],next:null,category:"",loaded:false},texts:null,allTime:null,known:{},latest:{}};
const PAGE_NEEDS={calendar:{parts:["races","results"]},voting:{parts:["races","drivers","polls"]},standings:{parts:["drivers","results"]},results:{parts:["races","drivers","results"]},penalties:{parts:["drivers","penalties"]},feed:{posts:true},rules:{texts:true},accounts:{},"s-drivers":{allTime:true},"s-teams":{allTime:true},"s-tracks":{allTime:true},"s-all":{allTime:true}};
const needs=p=>({parts:[],posts:false,texts:false,allTime:false,...(PAGE_NEEDS[p]||{})});
const SD=()=>STORE.data[STORE.seasonId]||{};
const seasonMeta=()=>STORE.seasons.find(s=>s.id===STORE.seasonId)||STORE.seasons[0]||{id:"",name:"",done:false,rev:0};
const L=()=>({...seasonMeta(),drivers:S.drivers,results:S.results});
const S={
  get races(){return SD().races||[]},
  get drivers(){return SD().drivers||[]},
  get results(){return SD().results||[]},
  get pen(){return SD().penalties||[]},
  get polls(){return SD().polls||[]},
  get posts(){return STORE.posts.items},
  get txt(){const o={};Object.keys(STORE.texts||{}).forEach(k=>o[k]=STORE.texts[k].value);return o}
};
const AL=()=>STORE.allTime||[];
let inFlight=0,pendingRefresh=false,textBaseRev=0,resultBaseRev=0;
const SEASON_KEY=()=>"f1liga25_season_"+(AUTH&&AUTH.username||"");
function persistSeason(id){
  try{sessionStorage.setItem(SEASON_KEY(),id)}catch(e){}
  api("setPrefs",{prefs:{selectedSeasonId:id}},false).catch(()=>{});
}
const isStale=key=>(STORE.latest[key]||0)!==(STORE.known[key]||0);
function applySeasons(list,version){
  STORE.seasons=list;STORE.known.seasons=version||0;
  if(!list.some(s=>s.id===STORE.seasonId)){STORE.seasonId=list[0]?list[0].id:"";if(STORE.seasonId)persistSeason(STORE.seasonId);}
}
function applyBoot(b){
  STORE.seasons=b.seasons;STORE.latest=b.versions||{};STORE.known.seasons=STORE.latest.seasons||0;
  let saved="";try{saved=sessionStorage.getItem(SEASON_KEY())||""}catch(e){}
  const prefs=b.prefs||{};
  const pick=[saved,prefs.selectedSeasonId,b.defaultSeasonId].find(id=>id&&b.seasons.some(s=>s.id===id));
  STORE.seasonId=pick||(b.seasons[0]&&b.seasons[0].id)||"";
  try{sessionStorage.setItem(SEASON_KEY(),STORE.seasonId)}catch(e){}
  if(typeof prefs.feedFilter==="string"&&(prefs.feedFilter===""||CATS.includes(prefs.feedFilter)))fc=prefs.feedFilter;
}
function mergeSeason(sid,data,partVersions){
  const d=STORE.data[sid]||(STORE.data[sid]={});
  Object.keys(data).forEach(p=>{d[p]=data[p];STORE.known["s."+sid+"."+p]=partVersions[p]||0});
}
async function loadSeasonParts(sid,parts){const r=await api("loadSeason",{seasonId:sid,parts},false);mergeSeason(sid,r.data,r.partVersions);}
async function loadFeed(reset){
  const P=STORE.posts,r=await api("loadFeed",{category:fc,before:reset?null:P.next,limit:30},false);
  P.items=reset?r.posts:P.items.concat(r.posts);P.next=r.next;P.loaded=true;P.category=fc;
  if(reset)STORE.known.posts=r.version;
}
async function loadTexts(){const r=await api("loadTexts",{},false);STORE.texts=r.texts;STORE.known.texts=r.version;}
async function loadAllTime(){const r=await api("loadAllTime",{},false);STORE.allTime=r.leagues;STORE.known.allTime=r.version;}
function plan(page){
  const n=needs(page),sid=STORE.seasonId,d=STORE.data[sid]||{};
  return{
    parts:n.parts.filter(p=>!d[p]||isStale("s."+sid+"."+p)),
    posts:n.posts&&(!STORE.posts.loaded||isStale("posts")||STORE.posts.category!==fc),
    texts:n.texts&&(!STORE.texts||isStale("texts")),
    allTime:n.allTime&&(!STORE.allTime||isStale("allTime"))
  };
}
const planEmpty=p=>!p.parts.length&&!p.posts&&!p.texts&&!p.allTime;
async function loadPlan(page){
  const p=plan(page),jobs=[];
  if(p.parts.length)jobs.push(loadSeasonParts(STORE.seasonId,p.parts));
  if(p.posts)jobs.push(loadFeed(true));
  if(p.texts)jobs.push(loadTexts());
  if(p.allTime)jobs.push(loadAllTime());
  await Promise.all(jobs);
  return jobs.length>0;
}
const busyUI=()=>hasActiveEditor()||!!document.querySelector(".dd.open");
function hasActiveEditor(){
  const a=document.activeElement;
  return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"));
}
function loadingView(){return `<div class="g card" style="display:grid;place-items:center;min-height:160px"><span class="liquid-spinner" role="status" aria-label="Loading"></span></div>`}
// Show a page: draw the shell instantly, download only what this page needs, then draw the page.
async function show(){
  if(!isLoggedIn()){renderLogin();return;}
  const page=cur();
  if(!planEmpty(plan(page))){
    if(pg[page]&&!(page==="accounts"&&!isAdmin())){render(loadingView());}
    try{await loadPlan(page);}catch(e){handleApiError(e);return;}
  }
  if(cur()===page)render();
}
function handleApiError(e){
  if(/sign in again|session expired/i.test(e.message||"")){AUTH=null;try{localStorage.removeItem(AUTH_KEY)}catch(_){};renderLogin();}
  else notify(e.message||"Request failed","error");
}
// One tiny request. Re-downloads only what changed for the page that is open.
async function pollOnce(){
  const r=await api("poll",{seasonsV:STORE.known.seasons},false);
  STORE.latest=r.versions;
  let changed=false;
  if(r.seasons){applySeasons(r.seasons,r.versions.seasons);changed=true;}
  if(!changed&&planEmpty(plan(cur())))return;
  if(busyUI()){pendingRefresh=true;return;}
  pendingRefresh=false;
  await loadPlan(cur());
  render();
}
function applyPendingRefresh(){
  if(!pendingRefresh||busyUI()||inFlight||refreshBusy)return;
  pendingRefresh=false;
  refreshBusy=true;
  loadPlan(cur()).then(()=>render()).catch(e=>console.warn("Refresh failed:",e)).finally(()=>{refreshBusy=false;});
}
function startAutoRefresh(){
  if(window.__f1AutoRefreshStarted)return;window.__f1AutoRefreshStarted=true;
  const tick=async()=>{
    if(!isLoggedIn()||inFlight||refreshBusy||document.hidden)return;
    refreshBusy=true;
    try{await pollOnce();}
    catch(e){if(/sign in again|session expired/i.test(e.message))handleApiError(e);else console.warn("Background refresh failed:",e);}
    finally{refreshBusy=false;}
  };
  window.setInterval(tick,2000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick();});
}
addEventListener("focusout",()=>window.setTimeout(applyPendingRefresh,0));
addEventListener("click",()=>window.setTimeout(applyPendingRefresh,0));

// Every shared-data change is ONE server operation. The server locks, checks revisions, writes, bumps versions
// and returns the fresh parts of the page that is open, so there is no second round trip in the normal case.
async function mutate(op){
  inFlight++;
  try{
    const r=await api("mutate",{op,want:{seasonId:STORE.seasonId,parts:needs(cur()).parts}});
    STORE.latest=r.versions;
    if(r.seasons)applySeasons(r.seasons,r.versions.seasons);
    if(r.loaded)mergeSeason(r.loaded.seasonId,r.loaded.data,r.loaded.partVersions);
    await loadPlan(cur());
    return r.result||{};
  }catch(e){
    if(e.code==="CONFLICT"||e.code==="NOT_FOUND"){
      notify(e.code==="CONFLICT"?"Someone else changed this at the same time. The latest data has been loaded; please check and try again.":e.message,"error");
      try{const p=await api("poll",{seasonsV:STORE.known.seasons},false);STORE.latest=p.versions;if(p.seasons)applySeasons(p.seasons,p.versions.seasons);await loadPlan(cur());render();}catch(_){}
      e.handled=true;
    }
    throw e;
  }finally{inFlight--;}
}
const fail=e=>{if(!e.handled)notify(e.message||"Something went wrong.","error");};

async function init(){
  try{
    const cached=localStorage.getItem(AUTH_KEY);
    if(cached){
      AUTH=JSON.parse(cached);
      applyBoot(await api("bootstrap",{},false));
      startAutoRefresh();await show();return;
    }
  }catch(e){console.warn("Saved login could not be restored:",e);}
  AUTH=null;try{localStorage.removeItem(AUTH_KEY)}catch(e){}
  renderLogin();
}

function stats(ls,noT){const D={},T={};
const dr=(n,t)=>D[n.toLowerCase()]||(D[n.toLowerCase()]={name:n,team:t,pts:0,w:0,p:0,r:0,ti:0});

l.results.forEach(r=>r.order.forEach((n,i)=>{const t=tt[n.toLowerCase()]||"-",d=dr(n,t),p=PTS[i]||0;d.pts+=p;d.r++;if(i==0)d.w++;if(i<3)d.p++;const x=tm(t);x.pts+=p;if(i==0)x.w++;if(i<3)x.p++}))});

pg.results=()=>{
  const races=S.races.filter(r=>r.status!=="proposed"&&r.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(!races.some(r=>r.id===resultRaceId))resultRaceId=races[0]?.id||"";
  const existing=S.results.find(r=>r.raceId===resultRaceId);
  if(!resultDraft.length){resultDraft=existing?[...existing.order]:[""];resultBaseRev=existing?existing.rev:0;}
  const rows=resultDraft.map((name,i)=>`<div class="result-row"><div class="step">P${i+1}</div><div class="field"><label>${i===0?'Race winner':i===1?'2nd place':i===2?'3rd place':`Position ${i+1}`}</label>${dd("result-driver-"+i,[["","Select driver"],...S.drivers.map(d=>[d.name,d.name])],name,v=>{resultDraft[i]=v})}</div><button class="x" onclick="removeResultDriver(${i})" ${resultDraft.length<=1?'disabled':''}>Remove</button></div>`).join("");
  const saved=[...S.results].reverse().map(r=>{const rc=raceOf(r.raceId);return `<div class="g card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(rc?rc.track:"Race")}</h3><div class="mu">${rc?fmt(rc.date,{day:"numeric",month:"long",year:"numeric"}):"Race no longer in calendar"}</div></div>${isAdmin()?`<button class="x" onclick="editResult('${r.raceId}')">Edit result</button><button class="x" onclick="del('results','${r.id}')">Remove</button>`:""}</div>${table(["Position","Driver",{t:"Points",n:1}],r.order.map((n,i)=>`<tr><td class="pos">P${i+1}</td><td>${esc(n)}</td><td class="n"><b>${PTS[i]||0}</b></td></tr>`))}</div>`}).join("");
  return `${isAdmin()?`<div class="g card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Enter race result</h3><p class="mu" style="margin:4px 0 0">Choose the race, then select each driver in finishing order. Points are added automatically.</p></div><span class="tag">${existing?'Editing saved result':'New result'}</span></div>${races.length?`<div class="field" style="margin-top:16px"><label>Race</label>${dd("result-race",[["","Choose a race"],...races.map(r=>[r.id,`${r.track} · ${fmt(r.date,{day:"numeric",month:"short",year:"numeric"})}`])],resultRaceId,v=>setResultRace(v))}</div><div style="margin-top:14px"><div class="row" style="justify-content:space-between"><b>Finishing order</b><span class="mu">P1 gets ${PTS[0]} pts · P10 gets ${PTS[9]} pt</span></div>${rows}<div class="row" style="margin-top:12px"><button type="button" onclick="addResultDriver()">＋ Add finishing position</button><button class="p" onclick="saveResult()" ${!resultRaceId?'disabled':''}>Save race result</button></div></div>`:'<p class="empty">Add a race in Race Calendar before entering results.</p>'}</div>`:`<div class="g card"><h3>Race Results</h3><p class="mu">Results are read-only for regular members.</p></div>`}${saved||'<div class="g card empty-state">No race results have been entered yet.</div>'}`;
};

${isAdmin()?`<div class="g card"><h3>Add penalty</h3><div class="row">${dd("pd",S.drivers.map(d=>[d.name,d.name]))}<input id="pp" type="number" min="1" value="1" style="width:84px"><input id="pr" placeholder="Reason / race" style="flex:1"><button class="p" onclick="addPen()">Add</button></div></div>`:""}
<div class="g card"><h3>History</h3>${table(["Driver",{t:"Points",n:1},"Reason",""],[...S.pen].reverse().map(p=>`<tr><td><b>${esc(p.driver)}</b></td><td class="n">${p.pts}</td><td class="mu">${esc(p.reason)}</td><td>${isAdmin()?`<button class="x" onclick="del('pen','${p.id}')">Remove</button>`:""}</td></tr>`))}</div>`};
pg.feed=()=>`<div class="g card"><div class="row" style="margin-bottom:12px">${dd("fk",(isAdmin()?CATS:CATS.filter(c=>c!=="Announcement")).map(c=>[c,c]))}</div><textarea id="fp" placeholder="Write a post"></textarea><div style="margin-top:12px"><button id="feed-post-button" class="p post-submit" onclick="addPost()">Post</button></div></div>

pg.rules=()=>[["rules","Rules"],["conduct","Driving Conduct"],["director","Race Director Guide"]].map(([k,t])=>`<div class="g card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">${t}</h3>${isAdmin()&&editing==k?"":(isAdmin()?`<button onclick="startEdit('${k}')">Edit</button>`:"")}</div>${isAdmin()&&editing==k?`<textarea id="te" style="min-height:220px">${esc(S.txt[k])}</textarea><div class="row" style="margin-top:12px"><button class="p" onclick="saveText('${k}')">Save</button><button onclick="editing='';render()">Cancel</button></div>`:`<div class="txt">${esc(S.txt[k])}</div>`}</div>`).join("");

pg.accounts=()=>`<div class="g card"><h3>Account management</h3><p class="mu">Create individual logins and assign roles. Accounts are stored securely by Google Apps Script.</p><div class="form-grid"><div class="field"><label>Username</label><input id="newuser" placeholder="e.g. Lena"></div><div class="field"><label>Temporary password</label><input id="newpass" type="password" placeholder="At least 10 characters"></div><div class="field"><label>Role</label>${dd("newrole",[["user","Regular user"],["admin","Admin"]],"user")}</div></div><button class="p" style="margin-top:14px" onclick="createAccount()">Create account</button></div><div class="g card"><h3>Registered accounts</h3><div id="account-list" class="empty">Loading accounts…</div></div><div class="g card"><h3>Season management</h3><p class="mu">Deleting a season permanently removes its races, votes, results and penalties.</p>${dd("deleteseason",STORE.seasons.map(l=>[l.id,l.name]))}<button class="x" onclick="deleteSeason()">Delete selected season</button></div>`;
async function changeMyPassword(){const password=await askInput("Enter your new password (at least 10 characters):","Change password",true);if(!password)return;try{await api("changePassword",{password});notify("Your password has been changed.");}catch(e){notify(e.message,"error");}}
async function refreshAccounts(){try{const r=await api("listUsers");$("account-list").innerHTML=r.users.map(u=>`<div class="race"><div class="grow"><b>${esc(u.username)}</b><div class="mu">${u.role==="admin"?"Administrator":"Regular user"}</div></div><button class="x" onclick="resetAccountPassword('${esc(u.username)}')">Reset password</button>${u.username!=="Albert"?`<button class="x" onclick="removeAccount('${esc(u.username)}')">Delete</button>`:""}</div>`).join("")||"No accounts.";}catch(e){$("account-list").textContent=e.message;}}
async function createAccount(){try{await api("createUser",{username:$("newuser").value.trim(),password:$("newpass").value,role:DDV.newrole||"user"});notify("Account created.");render();refreshAccounts();}catch(e){notify(e.message,"error");}}
async function removeAccount(username){if(!await askConfirm(`Delete account ${username}?`,"Delete account"))return;beginDeleteBusy();try{await api("deleteUser",{username},false);await refreshAccounts();}catch(e){notify(e.message,"error");}finally{endDeleteBusy();}}
async function resetAccountPassword(username){const password=await askInput(`New temporary password for ${username} (at least 10 characters):`,`Reset password · ${username}`,true);if(!password)return;try{await api("resetPassword",{username,password});notify("Password updated.");}catch(e){notify(e.message,"error");}}
async function deleteSeason(){
  const id=String(DDV.deleteseason||"");
  const season=STORE.seasons.find(l=>String(l.id)===id);
  if(!season){notify("Select a season first.","error");return;}
  if(STORE.seasons.length<2){notify("At least one season must remain.","error");return;}
  if(!await askConfirm(`Delete “${season.name}” and all its data?`,"Delete season"))return;
  beginDeleteBusy();
  try{
    await mutate({type:"season.delete",id});
    delete STORE.data[id];
    DDV.deleteseason=STORE.seasons[0]?.id||"";
    render();
    notify("Season deleted.");
  }catch(e){fail(e);}
  finally{endDeleteBusy();}
}

pg["s-drivers"]=()=>`<div class="g card">${table(["#","Driver",{t:"Leagues",n:1},{t:"Titles",n:1},{t:"Races",n:1},{t:"Wins",n:1},{t:"Podiums",n:1},{t:"Points",n:1}],stats(AL()).d.map((d,i)=>`<tr><td class="pos">${i+1}</td><td><b>${esc(d.name)}</b></td><td class="n">${AL().filter(l=>l.drivers.some(x=>x.name.toLowerCase()==d.name.toLowerCase())).length}</td><td class="n">${d.ti}</td><td class="n">${d.r}</td><td class="n">${d.w}</td><td class="n">${d.p}</td><td class="n"><b>${d.pts}</b></td></tr>`))}</div>`;

<div class="g card"><h3>Hall of Fame</h3>${ch.map(l=>{const c=champ(l);return`<div class="race"><div class="dt"><b>1</b><span>Champ</span></div><div class="grow"><b>${esc(c.name)}</b><div class="mu">${esc(c.team)} - ${esc(l.name)}</div></div><span class="tag">${c.pts} pts</span></div>`}).join("")||'<div class="empty">Champions appear here automatically when a league is marked as finished.</div>'}</div>`};
const DDV={},DDO={},DDF={};
function dd(id,opts,def,fn){const v=DDV[id]!=null&&opts.some(o=>o[0]==DDV[id])?DDV[id]:(def!=null?def:(opts[0]?opts[0][0]:""));DDV[id]=v;DDO[id]=opts;DDF[id]=fn;const c=opts.find(o=>o[0]==v);
return`<div class="dd" id="${id}"><button type="button" class="ddb" onclick="ddt(event,'${id}')">${esc(c?c[1]:"Select")}</button><div class="ddm">${opts.map((o,i)=>`<div class="${o[0]==v?"sel":""}" onclick="dds('${id}',${i})">${esc(o[1])}</div>`).join("")}</div></div>`}
function closeDropdown(el){if(!el)return;const menu=el.querySelector(".ddm")||document.querySelector(`.ddm[data-portal-for="${el.id}"]`);if(menu?.classList.contains("portal-open")){menu.classList.remove("portal-open");menu.removeAttribute("data-portal-for");el.appendChild(menu);menu.style.cssText=""}el.classList.remove("open")}
function ddt(e,id){e.stopPropagation();const pageX=window.scrollX,pageY=window.scrollY,navScroll=$("nav")?.scrollTop||0;const el=$(id),o=el.classList.contains("open");document.querySelectorAll(".dd.open").forEach(d=>closeDropdown(d));if(!o){el.classList.add("open");const menu=el.querySelector(".ddm"),r=el.getBoundingClientRect();menu.dataset.portalFor=id;menu.classList.add("portal-open");document.body.appendChild(menu);const maxH=Math.min(240,window.innerHeight*.45);const below=window.innerHeight-r.bottom;const top=below>=Math.min(maxH,menu.scrollHeight+8)?r.bottom+6:Math.max(8,r.top-Math.min(maxH,menu.scrollHeight)-6);menu.style.left=Math.max(8,Math.min(r.left,window.innerWidth-r.width-8))+"px";menu.style.top=top+"px";menu.style.width=r.width+"px";menu.style.maxHeight=maxH+"px";}requestAnimationFrame(()=>{window.scrollTo(pageX,pageY);const n=$("nav");if(n)n.scrollTop=navScroll;});}
function dds(id,i){const o=DDO[id][i],el=$(id),menu=document.querySelector(`.ddm[data-portal-for="${id}"]`)||el.querySelector(".ddm");DDV[id]=o[0];el.querySelector(".ddb").textContent=o[1];menu.querySelectorAll("div").forEach((d,j)=>d.className=j==i?"sel":"");closeDropdown(el);if(DDF[id])DDF[id](o[0])}
document.addEventListener("click",e=>{document.querySelectorAll(".dd.open").forEach(d=>{if(!d.contains(e.target)&&!document.querySelector(`.ddm[data-portal-for="${d.id}"]`)?.contains(e.target))closeDropdown(d)})});
addEventListener("click",()=>document.querySelectorAll(".dd.open").forEach(d=>d.classList.remove("open")));
async function del(k,id){const labels={races:"race",results:"race result",pen:"penalty entry",posts:"Feed post"};const ops={races:"race.remove",results:"result.remove",pen:"penalty.remove",posts:"post.remove"};const label=labels[k]||"item";if(!await askConfirm(`Delete this ${label}? This cannot be undone.`,"Confirm deletion"))return;beginDeleteBusy();try{await mutate({type:ops[k],seasonId:STORE.seasonId,id});render();notify(`${label[0].toUpperCase()+label.slice(1)} deleted.`)}catch(e){fail(e)}finally{endDeleteBusy();}}
async function addRace(){const t=$("rt").value.trim();if(!t){notify("Enter a track name first.");return}try{await mutate({type:"race.add",seasonId:STORE.seasonId,track:t,note:$("rn").value.trim()});render()}catch(e){fail(e)}}
async function refreshDriverAccounts(){const host=$("member-account-select");if(!host)return;try{const r=await api("listUsers");const names=(r.users||[]).map(u=>u.username).filter(Boolean);const available=names.filter(n=>!S.drivers.some(d=>d.name.toLowerCase()===n.toLowerCase()));host.innerHTML=available.length?dd("memberaccount",[["","Choose an account"],...available.map(n=>[n,n])]):'<span class="mu">All registered accounts are already league members.</span>';}catch(e){host.textContent="Could not load accounts: "+e.message;}}
async function addDriver(){const n=DDV.memberaccount||"";if(!n){notify("Choose an existing account first.","error");return;}if(S.drivers.some(d=>d.name.toLowerCase()===n.toLowerCase())){notify("That account is already a league member.","error");return;}try{await mutate({type:"driver.add",seasonId:STORE.seasonId,name:n,team:$("dt").value.trim()||"Independent"});notify("League member added.");render();}catch(e){fail(e)}}
async function removeDriver(i){const d=S.drivers[i];if(!d)return;try{await mutate({type:"driver.remove",seasonId:STORE.seasonId,name:d.name});render()}catch(e){fail(e)}}
async function toggleSeasonDone(done){try{await mutate({type:"season.update",id:STORE.seasonId,done:!!done});render()}catch(e){fail(e);render()}}
async function addLeague(){const n=$("ln").value.trim();if(!n)return;try{const r=await mutate({type:"season.create",name:n,copyDriversFrom:$("lk").checked?STORE.seasonId:""});STORE.seasonId=r.id;persistSeason(r.id);await show()}catch(e){fail(e)}}
function setResultRace(id){resultRaceId=id;const old=S.results.find(r=>r.raceId===id);resultDraft=old?[...old.order]:[""];resultBaseRev=old?old.rev:0;render()}
function editResult(id){resultRaceId=id;const old=S.results.find(r=>r.raceId===id);resultDraft=old?[...old.order]:[""];resultBaseRev=old?old.rev:0;render()}
function addResultDriver(){resultDraft.push("");render()}
function removeResultDriver(i){if(resultDraft.length<=1)return;resultDraft.splice(i,1);render()}
async function saveResult(){const order=resultDraft.map(x=>String(x||"").trim()).filter(Boolean);if(!resultRaceId||!order.length){notify("Choose a race and at least one finishing driver.");return}if(new Set(order).size!==order.length){notify("Each driver can only appear once in the finishing order.");return}try{await mutate({type:"result.set",seasonId:STORE.seasonId,raceId:resultRaceId,order,baseRev:resultBaseRev});resultDraft=[];render()}catch(e){if(e.handled)resultDraft=[];fail(e)}}
async function addPen(){if(!DDV.pd)return;try{await mutate({type:"penalty.add",seasonId:STORE.seasonId,driver:DDV.pd,pts:parseInt($("pp").value,10)||1,reason:$("pr").value.trim()});render()}catch(e){fail(e)}}
let postBusy=false,postCooldownUntil=0,postCooldownTimer=null;
function updatePostButton(){const b=$("feed-post-button");if(!b)return;const left=Math.max(0,Math.ceil((postCooldownUntil-Date.now())/1000));b.disabled=postBusy||left>0;b.textContent=postBusy?"Posting…":left>0?`Wait ${left}s`:"Post";if(left>0){clearTimeout(postCooldownTimer);postCooldownTimer=setTimeout(updatePostButton,250);}}
async function addPost(){if(postBusy||Date.now()<postCooldownUntil){updatePostButton();return;}const field=$("fp"),t=field.value.trim(),category=DDV.fk;if(!t){notify("Write a post first.","error");return;}if(category==="Announcement"&&!isAdmin()){notify("Only admins can publish announcements.");return;}postBusy=true;updatePostButton();try{await mutate({type:"post.add",category,text:t});postCooldownUntil=Date.now()+5000;notify("Post published.");render();updatePostButton();}catch(e){postBusy=false;updatePostButton();notify(e.message||"Could not publish post.","error");return;}postBusy=false;updatePostButton();}
function addPollSlot(){pollSlots.push({date:"",time:"20:00"});render()}
function removePollSlot(i){if(pollSlots.length<=2)return;pollSlots.splice(i,1);render()}
async function createPoll(){const title=$("polltitle").value.trim(),raceId=DDV.pollrace||"";const slots=pollSlots.map((x,i)=>({date:$("poll-date-"+i)?.value||x.date,time:$("poll-time-"+i)?.value||x.time})).filter(x=>x.date&&x.time);if(!title||!raceId||slots.length<2){notify("Choose a proposed race, add a poll title and at least two complete date/time options.");return}const options=slots.map(x=>({date:x.date,time:x.time,label:new Date(x.date+"T"+x.time).toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}));try{await mutate({type:"poll.create",seasonId:STORE.seasonId,raceId,title,options});pollSlots=[{date:"",time:"20:00"},{date:"",time:"21:00"}];DDV.pollrace="";render()}catch(e){fail(e)}}
async function castVote(id){const poll=S.polls.find(p=>p.id===id);if(!poll||poll.closed)return;const optionId=DDV["pollchoice-"+id];if(!optionId){notify("Select a time slot first.");return}try{await mutate({type:"vote",seasonId:STORE.seasonId,pollId:id,optionId});render();}catch(e){fail(e)}}
async function closePoll(id){const poll=S.polls.find(p=>p.id===id);if(!poll)return;const race=S.races.find(r=>r.id===poll.raceId);let optionId="";if(race){optionId=DDV["pollwinner-"+id]||"";const option=poll.options.find(o=>o.id===optionId);if(!option){notify("Choose the date and time to schedule.");return}if(!poll.votes.length){if(!await askConfirm("Nobody has voted yet. Close and schedule the selected option anyway?","No votes yet"))return}}try{await mutate({type:"poll.close",seasonId:STORE.seasonId,pollId:id,optionId,baseRev:poll.rev});render()}catch(e){fail(e)}}
async function reopenPoll(id){const poll=S.polls.find(p=>p.id===id);if(!poll)return;try{await mutate({type:"poll.reopen",seasonId:STORE.seasonId,pollId:id,baseRev:poll.rev});render()}catch(e){fail(e)}}
async function deletePoll(id){if(!await askConfirm("Delete this poll and all its votes?","Delete poll"))return;beginDeleteBusy();try{await mutate({type:"poll.delete",seasonId:STORE.seasonId,pollId:id});render();notify("Poll deleted.");}catch(e){fail(e)}finally{endDeleteBusy();}}
function startEdit(k){editing=k;textBaseRev=(STORE.texts&&STORE.texts[k]&&STORE.texts[k].rev)||0;render()}
async function saveText(k){try{await mutate({type:"text.set",key:k,value:$("te").value,baseRev:textBaseRev});editing="";render()}catch(e){if(e.handled)editing="";fail(e)}}
async function setFeedFilter(c){fc=c;api("setPrefs",{prefs:{feedFilter:c}},false).catch(()=>{});try{await loadFeed(true);render()}catch(e){fail(e)}}
async function moreFeed(){try{await loadFeed(false);render()}catch(e){fail(e)}}
function initNavScrollbar(){const nav=$("nav");if(!nav)return;nav.querySelector("#nav-scroll-track")?.remove();const track=document.createElement("div");track.id="nav-scroll-track";const thumb=document.createElement("div");thumb.id="nav-scroll-thumb";track.appendChild(thumb);nav.appendChild(track);const update=()=>{const max=nav.scrollHeight-nav.clientHeight,trackH=track.clientHeight;if(max<=0){track.style.display="none";return}track.style.display="block";const h=Math.max(42,Math.min(trackH*.46,trackH*nav.clientHeight/nav.scrollHeight));thumb.style.height=h+"px";thumb.style.top=((trackH-h)*(nav.scrollTop/max))+"px"};nav.addEventListener("scroll",update,{passive:true});let dragY=0,startTop=0;thumb.addEventListener("pointerdown",e=>{e.preventDefault();dragY=e.clientY;startTop=parseFloat(thumb.style.top)||0;thumb.setPointerCapture(e.pointerId)});thumb.addEventListener("pointermove",e=>{if(!thumb.hasPointerCapture(e.pointerId))return;const trackH=track.clientHeight,h=thumb.offsetHeight,max=nav.scrollHeight-nav.clientHeight,travel=trackH-h;nav.scrollTop=Math.max(0,Math.min(max,startTop+(e.clientY-dragY)*max/travel))});thumb.addEventListener("pointerup",e=>{if(thumb.hasPointerCapture(e.pointerId))thumb.releasePointerCapture(e.pointerId)});track.addEventListener("pointerdown",e=>{if(e.target===thumb)return;const r=track.getBoundingClientRect(),h=thumb.offsetHeight,max=nav.scrollHeight-nav.clientHeight;nav.scrollTop=Math.max(0,Math.min(max,((e.clientY-r.top-h/2)/(r.height-h))*max))});update();if(window.ResizeObserver){new ResizeObserver(update).observe(nav)}}
function render(override){if(!isLoggedIn()){renderLogin();return;}const c=pg[cur()]?cur():"calendar";if(c==="accounts"&&!isAdmin()){location.hash="#calendar";return;}
$("nav").innerHTML=`<div class="brand"><div class="logo"></div>F1 25 League</div><div class="mu" style="padding:0 12px 10px">${esc(AUTH.username)} · ${isAdmin()?"Admin":"Member"}</div>${(DDV.lg=STORE.seasonId,dd("lg",STORE.seasons.map(l=>[l.id,l.name]),null,v=>switchSeason(v)))}`+NAV.map(g=>{if(g[0]==="Administration"&&!isAdmin())return"";return `<div class="grp">${g[0]}</div>`+g[1].map(p=>`<a href="#${p[0]}" class="${p[0]==c?"on":""}">${p[1]}</a>`).join("")}).join("")+`<button style="margin:14px 10px" onclick="changeMyPassword()">Change password</button><button style="margin:0 10px 14px" onclick="logout()">Log out</button>`;
initNavScrollbar();
const subs={calendar:"Plan race nights and see what is next.",voting:"Vote on the date and time that works best for your next race.",standings:"Standings, members and seasons of your league.",results:"Race finishing orders and points.",penalties:"Track penalty points per driver.",rules:"Rules, driving conduct and the race director guide in one place.",feed:"Announcements, event texts, race reviews and messages in one place.",accounts:"Manage league accounts, roles and seasons."};
$("main").innerHTML=`<h1>${TITLES[c]||"Account Management"}</h1><p class="sub">${subs[c]||"F1 25 league administration."}</p>`+(override||pg[c]());$("nav").classList.remove("open");if(c==="accounts")refreshAccounts();if(c==="standings"&&isAdmin())refreshDriverAccounts();}
async function switchSeason(id){const picker=$("lg"),pageX=window.scrollX,pageY=window.scrollY,navScroll=$("nav")?.scrollTop||0,previous=STORE.seasonId;try{if(id===previous)return;picker?.classList.add("loading");picker?.querySelector(".ddb")?.setAttribute("aria-busy","true");STORE.seasonId=id;persistSeason(id);await loadPlan(cur());document.activeElement?.blur?.();render();requestAnimationFrame(()=>{window.scrollTo(pageX,pageY);const n=$("nav");if(n)n.scrollTop=navScroll;});}catch(e){STORE.seasonId=previous;persistSeason(previous);notify(e.message,"error");render();}}

addEventListener("hashchange",()=>{
  editing=false;
  show();
  scrollTo(0,0);
});

init();
